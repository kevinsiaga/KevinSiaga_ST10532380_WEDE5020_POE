<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4our.00 | Shop Catalog</title>
    
    <!-- Link the CSS file correctly -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Optional Google Font for clean modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="nav-container">
        <a href="index.html" class="logo">4our<span>.00</span></a>
        
        <!-- Mobile Menu Toggle Button -->
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation menu">
            ☰
        </button>

        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
    <section class="catalog-section">
        <div class="catalog-header">
            <h1>Catalog</h1>
            <p>Streetwear Essentials & Drops</p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div>
                <label for="category-select">Category:</label>
                <select id="category-select">
                    <option value="all">All Items</option>
                    <option value="tees">Tees</option>
                    <option value="outerwear">Outerwear</option>
                    <option value="denim">Denim</option>
                </select>
            </div>
            <div>
                <label for="sort-select">Sort By:</label>
                <select id="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
        </div>

        <!-- Product Grid Layout (Fixes the vertical stack issue) -->
        <div class="product-grid">
            
            <!-- Product 1 -->
            <article class="product-card">
                <img src="4our.00 Graphic Tee.png" alt="Heavy Graphic Tee in washed black">
                <h3>Heavy Graphic Tee</h3>
                <p class="price">R 450.00</p>
                <button class="btn-primary">Add to Cart</button>
            </article>

            <!-- Product 2 -->
            <article class="product-card">
                <img src="4our.00 Cargo Overshirt .png" alt="Cargo Overshirt in tactical olive">
                <h3>Cargo Overshirt</h3>
                <p class="price">R 850.00</p>
                <button class="btn-primary">Add to Cart</button>
            </article>

            <!-- Product 3 -->
            <article class="product-card">
                <img src="4our.00 Utility Hoodie Lookbook.png" alt="Utility Hoodie in vintage grey">
                <h3>Utility Hoodie</h3>
                <p class="price">R 720.00</p>
                <button class="btn-primary">Add to Cart</button>
            </article>

            <!-- Product 4 -->
            <article class="product-card">
                <img src="4our.00 Relaxed Denim.png" alt="Relaxed Denim jeans with distressed finish">
                <h3>Relaxed Denim</h3>
                <p class="price">R 950.00</p>
                <button class="btn-primary">Add to Cart</button>
            </article>

        </div>
    </section>
</main>

    <!-- Footer with Harvard Reference Link -->
    <footer class="site-footer">
        <p>&copy; 2026 4our.00. All rights reserved.</p>
        <p><a href="references.html">View Project References</a></p>
    </footer>

</body>
</html>
